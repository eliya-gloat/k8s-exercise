apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.global.appName }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.global.appName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.global.appName }}
    spec:
      containers:
        - name: {{ .Values.global.appName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          envFrom:
            - configMapRef:
                name: {{ .Values.global.appName }}-common-env-vars
            - configMapRef:
                name: {{ .Values.global.appName }}-env-vars
